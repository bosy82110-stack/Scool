name: Build Optimized Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ matrix.arch }} Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Build optimized Release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=${{ matrix.arch }} --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk basmala-${{ matrix.arch }}-release.apk

      - name: Upload optimized APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: basmala-${{ matrix.arch }}-release
          path: basmala-${{ matrix.arch }}-release.apk
          if-no-files-found: error
          retention-days: 14
